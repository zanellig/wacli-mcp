name: Publish to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.13.7"
      - name: Check the release tag matches the package version
        run: |
          expected="v$(uv version --short)"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "::error::Expected release tag $expected, got $GITHUB_REF_NAME"
            exit 1
          fi
      - run: uv lock --check
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/wacli-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.13.7"
          enable-cache: false
      - run: uv publish --trusted-publishing always
